name: Dev Build & Shift-Left Security

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run njsscan and Semgrep
        run: |
          pip install --no-cache-dir njsscan semgrep
          njsscan --exit-warning .
          semgrep scan --config auto --error .

  container-build-and-scan:
    runs-on: ubuntu-latest
    needs: [secrets-scan, sast-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan Dockerfile with Trivy
        run: trivy config ./Dockerfile

      - name: Build Docker image
        run: docker build -t shop-api:${{ github.sha }} .

      - name: Scan built image for HIGH and CRITICAL issues
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL shop-api:${{ github.sha }}
