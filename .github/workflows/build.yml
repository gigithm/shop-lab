name: Build Check

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run build check
        run: npm run build
